{% load static %}
<!-- Add Company -->
<div class="modal fade" id="calculate_new_garnishment">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Garnishment Calculator</h4>
                <button type="button" class="btn-close custom-btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="ti ti-x"></i>
                </button>
            </div>
            <form id="GarnishmentCalculatorForm" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body pb-0">
                    <div class="row">
                        <!-- Common Fields -->
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">Garnishment Type <span class="text-danger">*</span></label>
                                <select class="form-select" name="garnishment_type" required>
                                    <option value="">Select</option>
                                    <option value="Child Support">Child Support</option>
                                    <option value="Student Default Loan">Student Default Loan</option>
                                    <option value="Creditor Debt">Creditor Debt</option>
                                    <option value="Federal Tax Levy">Federal Tax Levy</option>
                                    <option value="State Tax Levy">State Tax Levy</option>
                                    <option value="Franchise Tax Board">Franchise Tax Board</option>
                                    <option value="Multiple Garnishment">Multiple Garnishment</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-md-4">
                          <div class="mb-3">
                            <label class="form-label">Work State <span class="text-danger">*</span></label>
                            <select class="form-select" name="work_state" required>
                              <option value="">-- Select State --</option>
                              <option value="Alabama">Alabama</option>
                              <option value="Alaska">Alaska</option>
                              <option value="Arizona">Arizona</option>
                              <option value="Arkansas">Arkansas</option>
                              <option value="California">California</option>
                              <option value="Colorado">Colorado</option>
                              <option value="Connecticut">Connecticut</option>
                              <option value="Delaware">Delaware</option>
                              <option value="Florida">Florida</option>
                              <option value="Georgia">Georgia</option>
                              <option value="Hawaii">Hawaii</option>
                              <option value="Idaho">Idaho</option>
                              <option value="Illinois">Illinois</option>
                              <option value="Indiana">Indiana</option>
                              <option value="Iowa">Iowa</option>
                              <option value="Kansas">Kansas</option>
                              <option value="Kentucky">Kentucky</option>
                              <option value="Louisiana">Louisiana</option>
                              <option value="Maine">Maine</option>
                              <option value="Maryland">Maryland</option>
                              <option value="Massachusetts">Massachusetts</option>
                              <option value="Michigan">Michigan</option>
                              <option value="Minnesota">Minnesota</option>
                              <option value="Mississippi">Mississippi</option>
                              <option value="Missouri">Missouri</option>
                              <option value="Montana">Montana</option>
                              <option value="Nebraska">Nebraska</option>
                              <option value="Nevada">Nevada</option>
                              <option value="New Hampshire">New Hampshire</option>
                              <option value="New Jersey">New Jersey</option>
                              <option value="New Mexico">New Mexico</option>
                              <option value="New York">New York</option>
                              <option value="North Carolina">North Carolina</option>
                              <option value="North Dakota">North Dakota</option>
                              <option value="Ohio">Ohio</option>
                              <option value="Oklahoma">Oklahoma</option>
                              <option value="Oregon">Oregon</option>
                              <option value="Pennsylvania">Pennsylvania</option>
                              <option value="Rhode Island">Rhode Island</option>
                              <option value="South Carolina">South Carolina</option>
                              <option value="South Dakota">South Dakota</option>
                              <option value="Tennessee">Tennessee</option>
                              <option value="Texas">Texas</option>
                              <option value="Utah">Utah</option>
                              <option value="Vermont">Vermont</option>
                              <option value="Virginia">Virginia</option>
                              <option value="Washington">Washington</option>
                              <option value="West Virginia">West Virginia</option>
                              <option value="Wisconsin">Wisconsin</option>
                              <option value="Wyoming">Wyoming</option>
                            </select>
                          </div>
                        </div>

                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">Pay Period <span class="text-danger">*</span></label>
                                <select class="form-select" name="pay_period" required>
                                    <option value="">Select</option>
                                    <option value="Weekly">Weekly</option>
                                    <option value="Biweekly">Biweekly</option>
                                    <option value="Monthly">Monthly</option>
                                    <option value="Semi-Monthly">Semi-Monthly</option>

                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic Fields Container -->
                    <div class="row" id="dynamic-fields"></div>

                    <!-- Results Container -->
                    <div class="row mt-3" id="calculation-results" style="display: none;">
                        <div class="col-12">
                            <div class="alert alert-info">
                                <h6>Calculation Results:</h6>
                                
                                <!-- Summary Information -->
                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <strong>Batch ID:</strong> <span id="summary-batch-id"></span>
                                    </div>
                                    <div class="col-md-3">
                                        <strong>Status:</strong> <span id="summary-status"></span>
                                    </div>
                                    <div class="col-md-3">
                                        <strong>Total Cases:</strong> <span id="summary-total-cases"></span>
                                    </div>
                                    <div class="col-md-3">
                                        <strong>Successful Cases:</strong> <span id="summary-successful-cases"></span>
                                    </div>
                                </div>

                                <!-- Main Results Table -->
                                <div class="table-responsive">
                                    <table class="table table-dark table-striped table-bordered">
                                        <thead>
                                            <tr>
                                                <th>DISPOSABLE EARNINGS</th>
                                                <th>ALLOWABLE DISPOSABLE EARNINGS</th>
                                                <th>TOTAL MANDATORY DEDUCTION</th>
                                                <th>WITHHOLDING AMOUNT</th>
                                                <th>WITHHOLDING ARREAR</th>
                                                <th>GARNISHMENT FEES</th>
                                            </tr>
                                        </thead>
                                        <tbody id="results-table-body">
                                            <!-- Table rows will be populated here -->
                                        </tbody>
                                    </table>
                                </div>

                                <!-- Additional Details -->
                                <div class="row mt-3" id="additional-details">
                                    <!-- Additional details will be populated here -->
                                </div>

                                <!-- Detailed Results JSON -->
                                <details class="mt-3">
                                    <summary><strong>Detailed Results (JSON)</strong></summary>
                                    <pre class="mt-2 p-2 bg-light rounded" style="font-size: 12px; max-height: 300px; overflow-y: auto;" id="detailed-json"></pre>
                                </details>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-light me-2" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-sm btn-warning me-2" id="reset-btn">Reset</button>
                    <button type="submit" class="btn btn-sm btn-primary">Calculate</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Z-index fix for Flatpickr -->
<style>
  .flatpickr-calendar {
    z-index: 1056 !important;
  }
  
  /* Multiple loan styling */
  .table-warning {
    background-color: rgba(255, 193, 7, 0.1) !important;
    border-left: 4px solid #ffc107 !important;
  }
  
  .loan-header {
    background-color: rgba(13, 110, 253, 0.1) !important;
    border-left: 4px solid #0d6efd !important;
    font-weight: bold;
  }
  
  .loan-header td {
    font-weight: bold;
    color: #0d6efd !important;
  }
</style>

<!-- Script -->
<script>
  const fieldSets = {
    'Child Support': [
      'Gross Pay', 'Total Mandatory Deductions', 'Support Second Family', 'Arrears Greater Than 12 Weeks',
      'Ordered Amount', 'Arrear Amount'
    ],
    'Student Default Loan': [
      'No. of Student Default Loan', 'Gross Pay', 'Total Mandatory Deductions'
    ],
    'Creditor Debt': [
      'Filing Status', 'No. of Dependent Child', 'Gross Pay', 'Consumer Debt', 'Non-Consumer Debt',
      'Garn-Start Date', 'Total Mandatory Deductions', 'Net Pay', 'No. of Exemptions (Including Self)'
    ],
    'Federal Tax Levy': [
      'Filing Status', 'Age', 'Net Pay', 'Is Blind', 'Statement of Exemption Received Date',
      'No. of Exemptions (Including Self)', 'Has Spouse', 'Is Spouse Blind', 'Spouse Age'
    ],
    'State Tax Levy': [
      'Garn Start Date', 'Gross Pay', 'Total Mandatory Deductions', 'Net Pay', 'No. of Exemptions (Including Self)'
    ],
    'Franchise Tax Board': [
    'FTB Type', 'Gross Pay', 'Total Mandatory Deductions'
    ],
    'Multiple Garnishment' : [
    'Checkbox'
    ],
  };

  const garnishmentTypeSelect = document.querySelector('[name="garnishment_type"]');
  const container = document.getElementById('dynamic-fields');
  const form = document.getElementById('GarnishmentCalculatorForm');

  function initializeFlatpickr() {
    flatpickr(".flatpickr", {
      dateFormat: "Y-m-d"
    });
  }

  // Generate random values for ee_id and batch_id
  function generateRandomId(prefix, length = 6) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let result = prefix;
    for (let i = 0; i < length; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

  function toMMDDYYYY(dateStr) {
  if (!dateStr) return null;
  const [year, month, day] = dateStr.split("-");
  return `${month}/${day}/${year}`;
}

  // Map form data to API payload for Child Support and Student Default Loan
  function mapFormDataToPayload(formData, garnishmentType) {
    const payload = {
      batch_id: generateRandomId('B'),
      cases: [{
        ee_id: generateRandomId('EE'),
        work_state: formData.get('work_state').toLowerCase(),
        no_of_exemption_including_self: parseInt(formData.get('no__of_exemptions__including_self_') || 0),
        is_multiple_garnishment_type: true | false,
        no_of_student_default_loan: garnishmentType == 'Student Default Loan' ? parseInt(formData.get('no_of_student_default_loan') || 0) : 1,
        pay_period: formData.get('pay_period'),
        home_state: "California",
        filing_status: formData.get('filing_status'),
        wages: 0,
        commission_and_bonus: parseFloat(formData.get('gross_pay') || 0),
        non_accountable_allowances: 0,
        gross_pay: parseFloat(formData.get('gross_pay') || 0),
        payroll_taxes: {
          federal_income_tax: parseFloat(formData.get('total_mandatory_deductions') || 0),
          social_security_tax: 0,
          medicare_tax: 0,
          state_tax: 0,
          local_tax: 0,
          union_dues: 0,
          wilmington_tax: 0,
          medical_insurance_pretax: 0,
          industrial_insurance: 0,
          life_insurance: 0,
          california_sdi: 0,
          famli_tax: 0
        },
        net_pay: parseFloat(formData.get('net_pay') || 0),
        is_blind: false,
        statement_of_exemption_received_date: "06-07-2025",
        garn_start_date: toMMDDYYYY(formData.get('garn_start_date'))|| "08-07-2025",
        non_consumer_debt: formData.get('non_consumer_debt') === 'on',
        consumer_debt: formData.get('consumer_debt') === 'on',
        age: 40,
        spouse_age: 34,
        is_spouse_blind: false,
        support_second_family: garnishmentType === 'Child Support' ? (formData.get('support_second_family') === 'on') : false,
        no_of_dependent_child: parseInt(formData.get('no__of_dependent_child') || 0),
        arrears_greater_than_12_weeks: garnishmentType === 'Child Support' ? (formData.get('arrears_greater_than_12_weeks') === 'on') : false,
        ftb_type: formData.get("ftb_type"),
        garnishment_data: [
          {
            type: (() => {
                  if (garnishmentType === "Child Support") return "child_support";
                  if (garnishmentType === "Student Default Loan") return "student_default_loan";
                  if (garnishmentType === "Creditor Debt") return "creditor_debt";
                  if (garnishmentType === "State Tax Levy") return "state_tax_levy";
                  if (garnishmentType === "Franchise Tax Board") return "franchise_tax_board";
                  if (garnishmentType === "Multiple Garnishment") return "multiple_garnishment";

                  return garnishmentType.toLowerCase().replace(/\s+/g, "_"); // fallback
                })(),
            data: [
              {
                case_id: generateRandomId('C'),
                ordered_amount: garnishmentType === 'Child Support' ? parseFloat(formData.get('ordered_amount') || 0) : 0,
                arrear_amount: garnishmentType === 'Child Support' ? parseFloat(formData.get('arrear_amount') || 0) : 0
              }
            ]
          }
        ],
        garnishment_orders: [
          "franchise_tax_board"
        ]
      }]
    };
    return payload;
  }

  // Make API call to calculate garnishment
  async function calculateGarnishment(payload) {
    try {
      const response = await fetch('/processor/calculate/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const result = await response.json();
      return result;
    } catch (error) {
      console.error('Error calculating garnishment:', error);
      throw error;
    }
  }

  // Handle form submission
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const garnishmentType = garnishmentTypeSelect.value;
    
    if (garnishmentType === 'Child Support' || garnishmentType === 'Student Default Loan' || 
        garnishmentType === 'Creditor Debt' || garnishmentType === 'State Tax Levy'  || 
        garnishmentType === 'Franchise Tax Board'|| garnishmentType === 'Multiple Garnishment') {
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;

      try {
        submitBtn.textContent = 'Calculating...';
        submitBtn.disabled = true;
        
        const formData = new FormData(form);
        const payload = mapFormDataToPayload(formData, garnishmentType);
        
        const result = await calculateGarnishment(payload);
        
        // Display results
        const resultsContainer = document.getElementById('calculation-results');
        const summaryBatchId = document.getElementById('summary-batch-id');
        const summaryStatus = document.getElementById('summary-status');
        const summaryTotalCases = document.getElementById('summary-total-cases');
        const summarySuccessfulCases = document.getElementById('summary-successful-cases');
        const resultsTableBody = document.getElementById('results-table-body');
        const detailedJson = document.getElementById('detailed-json');
        const additionalDetails = document.getElementById('additional-details');

        summaryBatchId.textContent = result.batch_id || 'N/A';
        summaryStatus.textContent = result.success ? 'Success' : 'Failed';
        summaryTotalCases.textContent = result.summary?.total_cases || 0;
        summarySuccessfulCases.textContent = result.summary?.successful_cases || 0;

        resultsTableBody.innerHTML = ''; // Clear previous table rows
        additionalDetails.innerHTML = ''; // Clear previous additional details

        if (result.results && result.results.length > 0) {
          result.results.forEach(caseResult => {
            // Extract withholding amounts from agency array
            let withholdingAmounts = [];
            let withholdingArrear = 'N/A';
            let garnishmentFees = 'N/A';

            if (caseResult.agency && caseResult.agency.length > 0) {
              // Extract withholding amounts - handle multiple student loans
              if (caseResult.agency[0].withholding_amt && caseResult.agency[0].withholding_amt.length > 0) {
                caseResult.agency[0].withholding_amt.forEach((amt, index) => {
                  if (amt.student_default_loan !== undefined) {
                    withholdingAmounts.push({
                      amount: amt.student_default_loan,
                      loanNumber: index + 1,
                      type: 'student_default_loan'
                    });
                  } else if (amt.garnishment_amount !== undefined) {
                    withholdingAmounts.push({
                      amount: amt.garnishment_amount,
                      loanNumber: index + 1,
                      type: 'garnishment'
                    });
                  }
                });
              }
              
              // Extract withholding arrear
              if (caseResult.agency[1] && caseResult.agency[1].arrear && caseResult.agency[1].arrear.length > 0) {
                withholdingArrear = caseResult.agency[1].arrear[0].withholding_arrear || 'N/A';
              }
            }

            // Extract garnishment fees from er_deduction
            if (caseResult.er_deduction && caseResult.er_deduction.garnishment_fees) {
              garnishmentFees = caseResult.er_deduction.garnishment_fees;
            }

            // If no withholding amounts found, create a default row
            if (withholdingAmounts.length === 0) {
              const row = document.createElement('tr');
              row.innerHTML = `
                <td>${caseResult.disposable_earning || 'N/A'}</td>
                <td>${caseResult.allowable_disposable_earning || 'N/A'}</td>
                <td>${caseResult.total_mandatory_deduction || 'N/A'}</td>
                <td>N/A</td>
                <td>${withholdingArrear}</td>
                <td>${garnishmentFees}</td>
              `;
              resultsTableBody.appendChild(row);
            } else {
              // Create a row for each withholding amount
              withholdingAmounts.forEach((withholding, index) => {
                const row = document.createElement('tr');
                
                // For student default loans, show loan number in the first column
                let firstColumn = caseResult.disposable_earning || 'N/A';
                if (withholding.type === 'student_default_loan' && withholdingAmounts.length > 1) {
                  firstColumn = `Loan ${withholding.loanNumber} - ${caseResult.disposable_earning || 'N/A'}`;
                }
                
                row.innerHTML = `
                  <td>${firstColumn}</td>
                  <td>${caseResult.allowable_disposable_earning || 'N/A'}</td>
                  <td>${caseResult.total_mandatory_deduction || 'N/A'}</td>
                  <td>${withholding.amount}</td>
                  <td>${withholdingArrear}</td>
                  <td>${garnishmentFees}</td>
                `;
                
                // Add visual distinction for multiple loans
                if (withholdingAmounts.length > 1) {
                  row.classList.add('table-warning');
                }
                
                resultsTableBody.appendChild(row);
              });
              
              // Add a summary row for multiple loans
              if (withholdingAmounts.length > 1 && withholdingAmounts[0].type === 'student_default_loan') {
                const totalAmount = withholdingAmounts.reduce((sum, withholding) => sum + withholding.amount, 0);
                const summaryRow = document.createElement('tr');
                summaryRow.classList.add('loan-header');
                summaryRow.innerHTML = `
                  <td><strong>Total (${withholdingAmounts.length} Loans)</strong></td>
                  <td>${caseResult.allowable_disposable_earning || 'N/A'}</td>
                  <td>${caseResult.total_mandatory_deduction || 'N/A'}</td>
                  <td><strong>${totalAmount.toFixed(2)}</strong></td>
                  <td>${withholdingArrear}</td>
                  <td>${garnishmentFees}</td>
                `;
                resultsTableBody.appendChild(summaryRow);
              }
            }

            // Add specific details for each case if available
            if (caseResult.garnishment_data && caseResult.garnishment_data.length > 0) {
              const caseDetails = document.createElement('div');
              caseDetails.className = 'col-md-6 mb-3';
              caseDetails.innerHTML = `
                <div class="card">
                  <div class="card-header">
                    <h6 class="mb-0">Case Details for ${caseResult.ee_id || 'N/A'}</h6>
                  </div>
                  <div class="card-body">
                    <div class="row">
                      <div class="col-md-6">
                        <p><strong>Employee ID:</strong> ${caseResult.ee_id || 'N/A'}</p>
                        <p><strong>Work State:</strong> ${caseResult.work_state || 'N/A'}</p>
                        <p><strong>Pay Period:</strong> ${caseResult.pay_period || 'N/A'}</p>
                        <p><strong>Filing Status:</strong> ${caseResult.filing_status || 'N/A'}</p>
                        <p><strong>Gross Pay:</strong> ${caseResult.gross_pay || 'N/A'}</p>
                        <p><strong>Net Pay:</strong> ${caseResult.net_pay || 'N/A'}</p>
                        <p><strong>Age:</strong> ${caseResult.age || 'N/A'}</p>
                        <p><strong>Spouse Age:</strong> ${caseResult.spouse_age || 'N/A'}</p>
                      </div>
                      <div class="col-md-6">
                        <p><strong>Student Default Loan:</strong> ${caseResult.no_of_student_default_loan || 'N/A'}</p>
                        <p><strong>Ordered Amount:</strong> ${caseResult.garnishment_data[0].data[0].ordered_amount || 'N/A'}</p>
                        <p><strong>Arrear Amount:</strong> ${caseResult.garnishment_data[0].data[0].arrear_amount || 'N/A'}</p>
                        <p><strong>Support Second Family:</strong> ${caseResult.support_second_family ? 'Yes' : 'No'}</p>
                        <p><strong>Arrears > 12 Weeks:</strong> ${caseResult.arrears_greater_than_12_weeks ? 'Yes' : 'No'}</p>
                        <p><strong>Is Blind:</strong> ${caseResult.is_blind ? 'Yes' : 'No'}</p>
                        <p><strong>Is Spouse Blind:</strong> ${caseResult.is_spouse_blind ? 'Yes' : 'No'}</p>
                        <p><strong>Dependent Children:</strong> ${caseResult.no_of_dependent_child || 'N/A'}</p>
                      </div>
                    </div>
                  </div>
                </div>
              `;
              additionalDetails.appendChild(caseDetails);
            }
          });
        }

        // Set the detailed JSON
        detailedJson.textContent = JSON.stringify(result.results, null, 2);
        
        resultsContainer.style.display = 'block';
        
        // Scroll to results
        resultsContainer.scrollIntoView({ behavior: 'smooth' });
        
      } catch (error) {
        console.error('Calculation failed:', error);
        
        // Display error
        const resultsContainer = document.getElementById('calculation-results');
        const resultsTableBody = document.getElementById('results-table-body');
        const detailedJson = document.getElementById('detailed-json');
        const additionalDetails = document.getElementById('additional-details');
        
        // Clear previous content
        resultsTableBody.innerHTML = '';
        additionalDetails.innerHTML = '';
        
        // Show error in the table
        const errorRow = document.createElement('tr');
        errorRow.innerHTML = `
          <td colspan="6" class="text-center text-danger">
            <strong>Error:</strong> ${error.message || 'An error occurred during calculation'}
          </td>
        `;
        resultsTableBody.appendChild(errorRow);
        
        // Set error in detailed JSON
        detailedJson.textContent = JSON.stringify({ error: error.message || 'An error occurred during calculation' }, null, 2);
        
        resultsContainer.style.display = 'block';
        resultsContainer.scrollIntoView({ behavior: 'smooth' });
        
      } finally {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    } else {
      // For other garnishment types, show a message
      alert(`Calculation for ${garnishmentType} is not yet implemented. Only Child Support and Student Default Loan calculations are currently available.`);
    }
  });

  garnishmentTypeSelect.addEventListener('change', function () {
    const type = this.value;
    container.innerHTML = '';
    
    // Hide results when changing garnishment type
    document.getElementById('calculation-results').style.display = 'none';

    if (fieldSets[type]) {
      fieldSets[type].forEach(label => {
        // Improved field name generation to handle special cases
        let name = label.toLowerCase();
        
        // Handle specific field names to ensure consistency
        if (label === 'No. of Student Default Loan') {
          name = 'no_of_student_default_loan';
        } else if (label === 'Total Mandatory Deductions') {
          name = 'total_mandatory_deductions';
        } else if (label === 'Gross Pay') {
          name = 'gross_pay';
        } else if (label === 'Support Second Family') {
          name = 'support_second_family';
        } else if (label === 'Arrears Greater Than 12 Weeks') {
          name = 'arrears_greater_than_12_weeks';
        } else if (label === 'Ordered Amount') {
          name = 'ordered_amount';
        } else if (label === 'Arrear Amount') {
          name = 'arrear_amount';
        } else {
          // Fallback to regex conversion for other fields
          name = label.toLowerCase().replace(/[^a-z0-9]/gi, '_');
        }
        
        const isDate = /date/i.test(label);
        const isNumeric = /amount|age|no\.|net pay|gross pay|deductions|exemptions|loan/i.test(label);

        // Force specific fields to boolean
        const isSwitch = /is |has |support|arrears/i.test(label) ||
          (type === 'Creditor Debt' && ['Consumer Debt', 'Non-Consumer Debt'].includes(label));

        if (isSwitch) {
          container.innerHTML += `
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label d-block">${label}</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="switch_${name}" name="${name}">
                  <label class="form-check-label" for="switch_${name}">${label}</label>
                </div>
              </div>
            </div>`;

        } else if (isDate) {
          container.innerHTML += `
            <div class="col-md-6 col-12 mb-3">
              <label class="form-label">${label}</label>
              <input type="text" class="form-control flatpickr" name="${name}" placeholder="YYYY-MM-DD" />
            </div>`;

        } else if (label === 'FTB Type') {
          container.innerHTML += `
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">${label}</label>
                <select class="form-control" name="${name}">
                  <option value="">Select FTB Type</option>
                  <option value="vehicle_registration">Vehicle Registration</option>
                  <option value="court_ordered_debt">Court Ordered Debt</option>
                  <option value="state_tax_levy">State Tax Levy</option>
                </select>
              </div>
            </div>`;

        } else if (label === 'Filing Status') {
          container.innerHTML += `
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">${label}</label>
                <select class="form-control" name="${name}">
                  <option value="">Select Filing Status</option>
                  <option value="single">Single</option>
                  <option value="married_joint">Married Filing Jointly</option>
                  <option value="married_separate">Married Filing Separately</option>
                  <option value="head">Head of Household</option>
                  <option value="widow">Qualifying Widow(er)</option>
                </select>
              </div>
            </div>`;    
            
          } else if (/checkbox/i.test(label) || label === 'Checkbox') {
          container.innerHTML += `              
              <!-- Instruction text -->
            
              <div class="mb-3">
              <h5 class="mb-3">Select Garnishments</h5>
              
              <p style="font-size: 0.85rem; font-weight: 400; margin-bottom: 0.5rem;">
                Please select more than one garnishment type from the options below. 
                You must select at least two types to proceed.
              </p>
                <div class="alert alert-primary d-flex align-items-center p-2 mb-2">
                  <i class="bi bi-info-circle-fill me-2"></i>
                  <div>
                    After selecting garnishment types, you'll be able to enter specific details for each type.
                  </div>
                </div>

                <div class="alert alert-warning d-flex align-items-center p-2 mb-0">
                  <i class="bi bi-exclamation-triangle-fill me-2"></i>
                  <div>
                    <strong>Restriction:</strong> You cannot select all three types 
                    (Child Support, Creditor Debt, and Student Default Loan) at once.<br>
                    Maximum of two types allowed from these three.
                  </div>
                </div>
              </div>
              
              <div class="row">
                <div class="col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="Child Support" id="mg_child_support">
                    <label class="form-check-label" for="mg_child_support">Child Support</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="Federal Tax Levy" id="mg_federal" disabled>
                    <label class="form-check-label" for="mg_federal">Federal Tax Levy</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="State Tax Levy" id="mg_state" disabled>
                    <label class="form-check-label" for="mg_state">State Tax Levy</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="Creditor Debt" id="mg_creditor">
                    <label class="form-check-label" for="mg_creditor">Creditor Debt</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="Student Default Loan" id="mg_student">
                    <label class="form-check-label" for="mg_student">Student Default Loan</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="Franchise Tax Board" id="mg_ftb" disabled>
                    <label class="form-check-label" for="mg_ftb">Franchise Tax Board</label>
                  </div>
                </div>
              </div>

              <div id="multiple-garnishment-fields" class="row mt-3"></div>

            </div>
          `;

        } else {
          container.innerHTML += `
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">${label}</label>
                <input type="${isNumeric ? 'number' : 'text'}" class="form-control" name="${name}" placeholder="Enter ${label}" />
              </div>
            </div>`;
          }
      });
      initializeFlatpickr(); // Re-initialize after rendering fields
    }
  });

// Listener for Multiple Garnishment checkboxes
document.addEventListener('change', function (e) {
  if (e.target && e.target.name === 'garnishment_types') {
    const selectedTypes = Array.from(
      document.querySelectorAll('input[name="garnishment_types"]:checked')
    ).map(cb => cb.value);

    const mgContainer = document.getElementById('multiple-garnishment-fields');
    mgContainer.innerHTML = ''; // clear previous

    selectedTypes.forEach(type => {
      if (fieldSets[type]) {
           const garnishmentThemes = {
              "Child Support": { bg: "#e6d9f5", text: "#4b2e83" },
              "Creditor Debt": { bg: "#ffe4d6", text: "#a94400" },
              "Student Default Loan": { bg: "#d6f5e3", text: "#1f7a3d" },
              "Federal Tax Levy": { bg: "#d6e9f5", text: "#004085" },
              "State Tax Levy": { bg: "#fff3cd", text: "#856404" },
              "Franchise Tax Board": { bg: "#f8d7da", text: "#721c24" }
    };

        const theme = garnishmentThemes[type] || { 
          bg: "#f0f0f0", 
          text: "#333", 
        };

        mgContainer.innerHTML += `
          <div class="col-12 mb-4">
            <div class="p-3 rounded shadow-sm"
                style="background-color: ${theme.bg}; color: ${theme.text}; 
                        cursor: pointer;"
                data-bs-toggle="collapse"
                data-bs-target="#collapse_${type.replace(/\s+/g, '_')}">
              
              <!-- Header + Subtext grouped -->
              <div class="d-flex flex-column">
                <div class="d-flex align-items-center mb-1"
                    style="font-size: 1.1rem; font-weight: 600;">
                  <span>${type} Details</span>
                </div>
                <small style="color: ${theme.text}; font-weight: 400; opacity: 0.65; margin-left: 0.7rem;">
                  Configure ${type.toLowerCase()} garnishment settings below.
                </small>
              </div>
            </div>

            <!-- Collapsible content area for fields -->
            <div id="collapse_${type.replace(/\s+/g, '_')}" class="collapse mt-2">
              <div id="body_${type.replace(/\s+/g, '_')}" 
                  class="row p-3 border rounded bg-light">

                <!-- 👉 Inject ${type} input fields here -->

              </div>
            </div>
          </div>
        `;

        // Find the collapse body for this type
        const collapseBody = document.getElementById(`body_${type.replace(/\s+/g, '_')}`);

        fieldSets[type].forEach(label => {
          const fieldWrapper = document.createElement('div');
          fieldWrapper.className = 'col-md-4 mb-3';

          const name = label.toLowerCase().replace(/\s+/g, '_');

          if (
            /is |has |support|arrears/i.test(label) || 
            /consumer debt|non[- ]consumer debt/i.test(label)
          ) {
            fieldWrapper.innerHTML = `
              <label class="form-label d-block">${label}</label>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="${name}" name="${name}">
                <label class="form-check-label" for="${name}">${label}</label>
              </div>
            `;
          } else if (/date/i.test(label)) {
            fieldWrapper.innerHTML = `
              <label class="form-label">${label}</label>
              <input type="text" class="form-control flatpickr" name="${name}" placeholder="YYYY-MM-DD">
            `;
          } else if (/amount|age|no\.|net pay|gross pay|deductions|exemptions|loan/i.test(label)) {
            fieldWrapper.innerHTML = `
              <label class="form-label">${label}</label>
              <input type="number" class="form-control" name="${name}" placeholder="Enter ${label}">
            `;
          } else {
            fieldWrapper.innerHTML = `
              <label class="form-label">${label}</label>
              <input type="text" class="form-control" name="${name}" placeholder="Enter ${label}">
            `;
          }
          collapseBody.appendChild(fieldWrapper);
        });
      }
    });

    initializeFlatpickr(); // re-init for date fields
  }
});

  document.getElementById('calculate_new_garnishment').addEventListener('shown.bs.modal', function () {
    initializeFlatpickr();
  });

  // Reset button functionality
  document.getElementById('reset-btn').addEventListener('click', function() {
    // Reset the form
    form.reset();
    
    // Reset garnishment type selection
    garnishmentTypeSelect.value = '';
    
    // Clear dynamic fields
    container.innerHTML = '';
    
    // Hide results section
    document.getElementById('calculation-results').style.display = 'none';
    
    // Reset any custom form elements (like switches)
    const switches = form.querySelectorAll('input[type="checkbox"]');
    switches.forEach(switchInput => {
      switchInput.checked = false;
    });
    
    // Clear any date inputs
    const dateInputs = form.querySelectorAll('.flatpickr');
    dateInputs.forEach(dateInput => { 
      dateInput.value = '';
    });
  });

</script>

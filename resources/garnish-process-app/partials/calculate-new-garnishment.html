<script>
  const fieldSets = {
    'Child Support': [
      'Support Second Family', 'Arrears Greater Than 12 Weeks',
      'Ordered Amount', 'Arrear Amount'
    ],
    'Student Default Loan': [
      'No. of Student Default Loan'
    ],
    'Creditor Debt': [
      'Filing Status', 'No. of Dependent Child', 'Consumer Debt', 'Non-Consumer Debt',
      'Garn-Start Date', 'No. of Exemptions (Including Self)'
    ],
    'Federal Tax Levy': [
      'Filing Status', 'Age', 'Is Blind', 'Statement of Exemption Received Date',
      'No. of Exemptions (Including Self)', 'Has Spouse', 'Is Spouse Blind', 'Spouse Age'
    ],
    'State Tax Levy': [
      'Garn Start Date', 'No. of Exemptions (Including Self)'
    ],
    'Franchise Tax Board': [
    'FTB Type'
    ],
    'Multiple Garnishment' : [
    'Checkbox'
    ],
  };

  // Common fields that should be shared across all garnishment types
  const commonFields = [
    'Gross Pay', 'Total Mandatory Deductions', 'Net Pay'
  ];

const garnishmentTypeSelect = document.querySelector('[name="garnishment_type"]');
const workStateSelect = document.querySelector('[name="work_state"]');
const payPeriodSelect = document.querySelector('[name="pay_period"]');
  const container = document.getElementById('dynamic-fields');
  const form = document.getElementById('GarnishmentCalculatorForm');

  function initializeFlatpickr() {
    flatpickr(".flatpickr", {
      dateFormat: "m-d-Y"
    });
  }

  let selectedTypes = [];

  // Generate random values for ee_id and batch_id
  function generateRandomId(prefix, length = 6) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let result = prefix;
    for (let i = 0; i < length; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

function toMMDDYYYY(dateStr) {
  if (!dateStr) return null;
  
  // Normalize separators
  const parts = dateStr.split(/[-/]/).map(p => p.trim());

  // Handle known formats
  let year, month, day;

  if (parts[0].length === 4) {
    // Format: YYYY-MM-DD
    [year, month, day] = parts;
  } else if (parts[2].length === 4) {
    // Format: MM/DD/YYYY or DD-MM-YYYY
    if (Number(parts[0]) > 12) {
      // DD-MM-YYYY → swap
      [day, month, year] = parts;
    } else {
      // MM/DD/YYYY
      [month, day, year] = parts;
    }
  } else if (parts[1].length === 4) {
    // Custom format: MM/YYYY/DD
    [month, year, day] = parts;
  } else {
    return null; // Unknown format
  }

  return `${month.padStart(2, '0')}/${day.padStart(2, '0')}/${year}`;
}

  // Map form data to API payload 
  function mapFormDataToPayload(formData, garnishmentType) {
    console.log("garnishmentType",garnishmentType)
    const payload = {
      batch_id: generateRandomId('B'),
      cases: [{
        ee_id: generateRandomId('EE'),
        work_state: formData.get('work_state').toLowerCase(),
        no_of_exemption_including_self: parseInt(formData.get('no__of_exemptions__including_self_') || 0),
        
        is_multiple_garnishment_type: garnishmentType === 'Multiple Garnishment' ? true : false,
        no_of_student_default_loan: parseInt(formData.get('no_of_student_default_loan') || 0),
        pay_period: formData.get('pay_period'),
        home_state: "California",
        filing_status: formData.get('filing_status'),
        wages: 0,
        commission_and_bonus: parseFloat(formData.get('gross_pay') || 0),
        non_accountable_allowances: 0,
        gross_pay: parseFloat(formData.get('gross_pay') || 0),
        payroll_taxes: {
          federal_income_tax: parseFloat(formData.get('total_mandatory_deductions') || 0),
          social_security_tax: 0,
          medicare_tax: 0,
          state_tax: 0,
          local_tax: 0,
          union_dues: 0,
          wilmington_tax: 0,
          medical_insurance_pretax: 0,
          industrial_insurance: 0,
          life_insurance: 0,
          california_sdi: 0,
          famli_tax: 0
        },
        net_pay: (() => {
          const netPayValue = formData.get('net_pay');
          if (netPayValue) {
            return parseFloat(netPayValue);
          }
          // For Child Support and Student Default Loan, calculate net pay if not provided
          if (garnishmentType === 'Child Support' || garnishmentType === 'Student Default Loan') {
            const grossPay = parseFloat(formData.get('gross_pay') || 0);
            const totalDeductions = parseFloat(formData.get('total_mandatory_deductions') || 0);
            return grossPay - totalDeductions;
          }
          return 0;
        })(),
        is_blind: false,
        statement_of_exemption_received_date: "06-07-2025",
        garn_start_date: toMMDDYYYY(formData.get('garn_start_date'))|| "08-07-2025",
        non_consumer_debt: formData.get('non_consumer_debt') === 'on',
        consumer_debt: formData.get('consumer_debt') === 'on',
        age: 40,
        spouse_age: 34,
        is_spouse_blind: false,
        support_second_family: garnishmentType === 'Child Support' ? (formData.get('support_second_family') === 'on') : false,
        no_of_dependent_child: parseInt(formData.get('no__of_dependent_child') || 0),
        arrears_greater_than_12_weeks: garnishmentType === 'Child Support' ? (formData.get('arrears_greater_than_12_weeks') === 'on') : false,
        ftb_type: formData.get("ftb_type"),
        garnishment_data: [
          {
            type: (() => {
                  if (garnishmentType === "Child Support") return "child_support";
                  if (garnishmentType === "Student Default Loan") return "student_default_loan";
                  if (garnishmentType === "Creditor Debt") return "creditor_debt";
                  if (garnishmentType === "State Tax Levy") return "state_tax_levy";
                  if (garnishmentType === "Franchise Tax Board") return "franchise_tax_board";
                  if (garnishmentType === "Federal Tax Levy") return "federal_tax_levy";
                  if (garnishmentType === "Multiple Garnishment") return selectedTypes[0].toLowerCase().replace(/\s+/g, "_");

                  return garnishmentType.toLowerCase().replace(/\s+/g, "_"); // fallback
                })(),
            data: [
              {
                case_id: generateRandomId('C'),
                ordered_amount: (
                  garnishmentType === 'Child Support' ||
                  garnishmentType === 'Multiple Garnishment'
                ) ? parseFloat(formData.get('ordered_amount') || 0) : 0,
                arrear_amount: (
                  garnishmentType === 'Child Support' ||
                  garnishmentType === 'Multiple Garnishment'
                ) ? parseFloat(formData.get('arrear_amount') || 0) : 0
              }
            ]
          },
          {
            type: (() => {
                  if (garnishmentType === "Child Support") return "child_support";
                  if (garnishmentType === "Student Default Loan") return "student_default_loan";
                  if (garnishmentType === "Creditor Debt") return "creditor_debt";
                  if (garnishmentType === "State Tax Levy") return "state_tax_levy";
                  if (garnishmentType === "Franchise Tax Board") return "franchise_tax_board";
                  if (garnishmentType === "Federal Tax Levy") return "federal_tax_levy";
                  if (garnishmentType === "Multiple Garnishment") return selectedTypes[1].toLowerCase().replace(/\s+/g, "_");

                  return garnishmentType.toLowerCase().replace(/\s+/g, "_"); // fallback
                })(),
            data: [
              {
                case_id: generateRandomId('C'),
                // pass numeric zeros (do not assign to garnishmentType)
                ordered_amount: 0,
                arrear_amount: 0
              }
            ]
          }

        ],
    // ensure a flat array of normalized type identifiers (no nested arrays)
    garnishment_orders: garnishmentType === 'Multiple Garnishment'
      ? selectedTypes.map(type => type.toLowerCase().replace(/\s+/g, "_"))
      : [garnishmentType.toLowerCase().replace(/\s+/g, "_")]
      }]
    };
    console.log("payload",payload)
    console.log("no_of_student_default_loan",formData.get('no_of_student_default_loan'))
    console.log(selectedTypes)      

    return payload;
  }

  // Make API call to calculate garnishment
  async function calculateGarnishment(payload) {
    try {
      const response = await fetch('/processor/calculate/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const result = await response.json();
      return result;
    } catch (error) {
      console.error('Error calculating garnishment:', error);
      throw error;
    }
  }

  // Handle form submission
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const garnishmentType = garnishmentTypeSelect.value;
    
    if (garnishmentType === 'Child Support' || garnishmentType === 'Student Default Loan' || 
        garnishmentType === 'Creditor Debt' || garnishmentType === 'State Tax Levy'  || 
        garnishmentType === 'Franchise Tax Board'|| garnishmentType === 'Federal Tax Levy'|| 
        garnishmentType === 'Multiple Garnishment') {
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      console.log("garnishmentType",garnishmentType)

      try {
        submitBtn.textContent = 'Calculating...';
        submitBtn.disabled = true;
        
        const formData = new FormData(form);
        const payload = mapFormDataToPayload(formData, garnishmentType);
        
        const result = await calculateGarnishment(payload);
        
        // Display results
        const resultsContainer = document.getElementById('calculation-results');
        const summaryBatchId = document.getElementById('summary-batch-id');
        const summaryStatus = document.getElementById('summary-status');
        const summaryTotalCases = document.getElementById('summary-total-cases');
        const summarySuccessfulCases = document.getElementById('summary-successful-cases');
        const resultsTableBody = document.getElementById('results-table-body');
        const detailedJson = document.getElementById('detailed-json');
        const additionalDetails = document.getElementById('additional-details');

        summaryBatchId.textContent = result.batch_id || 'N/A';
        summaryStatus.textContent = result.success ? 'Success' : 'Failed';
        summaryTotalCases.textContent = result.summary?.total_cases || 0;
        summarySuccessfulCases.textContent = result.summary?.successful_cases || 0;

        resultsTableBody.innerHTML = ''; // Clear previous table rows
        additionalDetails.innerHTML = ''; // Clear previous additional details
        
        // Clear all sections
        document.getElementById('garnishment-types-summary').innerHTML = '';
        document.getElementById('calculation-summary-section').innerHTML = '';
        document.getElementById('employer-deduction-section').innerHTML = '';
        
        // Clear and set up table headers based on garnishment type
        const resultsTableHeader = document.getElementById('results-table-header');
        resultsTableHeader.innerHTML = '';
        
        if (garnishmentType === 'Multiple Garnishment') {
          // Multiple garnishment headers
          resultsTableHeader.innerHTML = `
            <tr>
              <th>GARNISHMENT TYPE</th>
              <th>CASE ID</th>
              <th>ORDERED AMOUNT</th>
              <th>ARREAR AMOUNT</th>
              <th>WITHHOLDING AMOUNT</th>
              <th>ARREAR WITHHELD</th>
              <th>REMAINING BALANCE</th>
              <th>STATUS</th>
            </tr>
          `;
        } else {
          // Single garnishment headers (without Remaining Balance and Status)
          resultsTableHeader.innerHTML = `
            <tr>
              <th>DISPOSABLE EARNINGS</th>
              <th>ALLOWABLE DISPOSABLE EARNINGS</th>
              <th>TOTAL MANDATORY DEDUCTION</th>
              <th>WITHHOLDING AMOUNT</th>
              <th>WITHHOLDING ARREAR</th>
              <th>GARNISHMENT FEES</th>
            </tr>
          `;
        }

        if (result.results && result.results.length > 0) {
          result.results.forEach(caseResult => {
            if (garnishmentType === 'Multiple Garnishment') {
              // Handle Multiple Garnishment Response Structure
              // Display garnishment types summary
              const garnishmentTypesSummary = document.getElementById('garnishment-types-summary');
              if (caseResult.garnishment_types && caseResult.garnishment_types.length > 0) {
                garnishmentTypesSummary.innerHTML = `
                  <div class="col-12">
                    <div class="alert alert-light border">
                      <h6 class="mb-2 text-dark"><i class="bi bi-list-ul me-2"></i>Garnishment Types Processed:</h6>
                      <div class="d-flex flex-wrap gap-2">
                        ${caseResult.garnishment_types.map(type => 
                          `<span class="badge bg-dark">${type.replace(/_/g, ' ').toUpperCase()}</span>`
                        ).join('')}
                      </div>
                    </div>
                  </div>
                `;
              }

// Helper function to check all 3 inputs before rendering
function checkSelections() {
  const type = garnishmentTypeSelect.value;
  const workState = workStateSelect.value;
  const payPeriod = payPeriodSelect.value;

  // Clear fields + hide results
  container.innerHTML = '';
  document.getElementById('calculation-results').style.display = 'none';

  //  Only proceed if ALL 3 are selected
  if (type && workState && payPeriod && fieldSets[type]) {
    if (type !== 'Multiple Garnishment') {
      container.innerHTML += `
        <div class="col-12 mb-3">
          <div class="alert alert-info border-0" style="background-color: #e3f2fd; border-left: 4px solid #2196f3 !important;">
            <h6 class="mb-1 text-dark fw-bold"><i class="bi bi-person me-2"></i>Employee Information</h6>
            <small class="text-muted">Enter basic employee details required for garnishment calculations.</small>
          </div>
        </div>
      `;

      // Filter common fields for certain types
      const filteredCommonFields = commonFields.filter(label => {
        if (label === 'Net Pay' && (type === 'Child Support' || type === 'Student Default Loan')) {
          return false;
        }
        return true;
      });

      filteredCommonFields.forEach(label => renderField(label, type));

      // Add section header for type-specific fields
      container.innerHTML += `
        <div class="col-12 mb-3 mt-4">
          <div class="alert alert-light border-0" style="background-color: #f8f9fa; border-left: 4px solid #6c757d !important;">
            <h6 class="mb-1 text-dark fw-bold"><i class="bi bi-gear me-2"></i>${type} Specific Information</h6>
            <small class="text-muted">Enter ${type.toLowerCase()} specific details for calculation.</small>
          </div>
        </div>
      `;
    }

    // Render type-specific fields
    fieldSets[type].forEach(label => renderField(label, type));

    // Re-initialize datepickers if needed
    initializeFlatpickr();
  }
}

// Attach listeners to all 3 dropdowns
[garnishmentTypeSelect, workStateSelect, payPeriodSelect].forEach(select => {

});

  });

  // Reset button functionality
  document.getElementById('reset-btn').addEventListener('click', function() {
    // Reset the form
    form.reset();
    
    // Reset garnishment type selection
    garnishmentTypeSelect.value = '';
    
    // Clear dynamic fields
    container.innerHTML = '';
    
    // Hide results section
    document.getElementById('calculation-results').style.display = 'none';
    
    // Reset any custom form elements (like switches)
    const switches = form.querySelectorAll('input[type="checkbox"]');
    switches.forEach(switchInput => {
      switchInput.checked = false;
    });
    
    // Clear any date inputs
    const dateInputs = form.querySelectorAll('.flatpickr');
    dateInputs.forEach(dateInput => { 
      dateInput.value = '';
    });
  });

function renderField(label, type) {
        let name = label.toLowerCase();
        
        // Handle specific field names to ensure consistency
        if (label === 'No. of Student Default Loan') {
          name = 'no_of_student_default_loan';
        } else if (label === 'Total Mandatory Deductions') {
          name = 'total_mandatory_deductions';
        } else if (label === 'Gross Pay') {
          name = 'gross_pay';
        } else if (label === 'Support Second Family') {
          name = 'support_second_family';
        } else if (label === 'Arrears Greater Than 12 Weeks') {
          name = 'arrears_greater_than_12_weeks';
        } else if (label === 'Ordered Amount') {
          name = 'ordered_amount';
        } else if (label === 'Arrear Amount') {
          name = 'arrear_amount';
        } else {
          // Fallback to regex conversion for other fields
          name = label.toLowerCase().replace(/[^a-z0-9]/gi, '_');
        }
        
        const isDate = /date/i.test(label);
        const isNumeric = /amount|age|no\.|net pay|gross pay|deductions|exemptions|loan/i.test(label);

        // Force specific fields to boolean
        const isSwitch = /is |has |support|arrears/i.test(label) ||
          (type === 'Creditor Debt' && ['Consumer Debt', 'Non-Consumer Debt'].includes(label));

        if (isSwitch) {
          container.innerHTML += `
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label d-block">${label}</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="switch_${name}" name="${name}">
                  <label class="form-check-label" for="switch_${name}">${label}</label>
                </div>
              </div>
            </div>`;

        } else if (isDate) {
          container.innerHTML += `
            <div class="col-md-6 col-12 mb-3">
              <label class="form-label">${label}</label>
              <input type="text" class="form-control flatpickr" name="${name}" placeholder="MM-DD-YYYY" />
            </div>`;

        } else if (label === 'FTB Type') {
          container.innerHTML += `
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">${label}</label>
                <select class="form-control" name="${name}">
                  <option value="">Select FTB Type</option>
                  <option value="vehicle_registration">Vehicle Registration</option>
                  <option value="court_ordered_debt">Court Ordered Debt</option>
                  <option value="state_tax_levy">State Tax Levy</option>
                </select>
              </div>
            </div>`;

        } else if (label === 'Filing Status') {
          container.innerHTML += `
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">${label}</label>
                <select class="form-control" name="${name}">
                  <option value="">Select Filing Status</option>
                  <option value="single">Single</option>
                  <option value="married_joint">Married Filing Jointly</option>
                  <option value="married_separate">Married Filing Separately</option>
                  <option value="head">Head of Household</option>
                  <option value="widow">Qualifying Widow(er)</option>
                </select>
              </div>
            </div>`;    
            
          } else if (/checkbox/i.test(label) || label === 'Checkbox') {
          container.innerHTML += `              
              <!-- Instruction text -->
            
              <div class="mb-3">
              <h5 class="mb-3">Select Garnishments</h5>
              
              <p style="font-size: 0.85rem; font-weight: 400; margin-bottom: 0.5rem;">
                Please select more than one garnishment type from the options below. 
                You must select at least two types to proceed.
              </p>
                <div class="alert alert-primary d-flex align-items-center p-2 mb-2">
                  <i class="bi bi-info-circle-fill me-2"></i>
                  <div>
                    After selecting garnishment types, you'll be able to enter specific details for each type.
                  </div>
                </div>

                <div class="alert alert-warning d-flex align-items-center p-2 mb-0">
                  <i class="bi bi-exclamation-triangle-fill me-2"></i>
                  <div>
                    <strong>Restriction:</strong> You cannot select all three types 
                    (Child Support, Creditor Debt, and Student Default Loan) at once.<br>
                    Maximum of two types allowed from these three.
                  </div>
                </div>
              </div>
              
              <div class="row">
                <div class="col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="Child Support" id="mg_child_support">
                    <label class="form-check-label" for="mg_child_support">Child Support</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="Federal Tax Levy" id="mg_federal" disabled>
                    <label class="form-check-label" for="mg_federal">Federal Tax Levy</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="State Tax Levy" id="mg_state" disabled>
                    <label class="form-check-label" for="mg_state">State Tax Levy</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="Creditor Debt" id="mg_creditor">
                    <label class="form-check-label" for="mg_creditor">Creditor Debt</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="Student Default Loan" id="mg_student">
                    <label class="form-check-label" for="mg_student">Student Default Loan</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garnishment_types" value="Franchise Tax Board" id="mg_ftb" disabled>
                    <label class="form-check-label" for="mg_ftb">Franchise Tax Board</label>
                  </div>
                </div>
              </div>

              <div id="multiple-garnishment-fields" class="row mt-3"></div>

            </div>
          `;

        } else {
          // Special handling for common fields to ensure they appear as numeric inputs
          const isCommonField = commonFields.includes(label);
          const fieldType = (isNumeric || isCommonField) ? 'number' : 'text';
          
          container.innerHTML += `
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">${label} <span class="text-danger">*</span></label>
                <input type="${fieldType}" class="form-control" name="${name}" placeholder="Enter ${label}" required />
              </div>
            </div>`;
          }

}
</script>

{% load static %}
<!-- Add Client Modal -->
<div class="modal fade" id="add">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"><i class="fa fa-layer-plus"></i> Add Client</h4>
                <button type="button" class="btn-close custom-btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="ti ti-x"></i>
                </button>
            </div>

            <form id="addClientForm">
                {% csrf_token %}
                <input type="hidden" name="peo" value="PEO45678">

                <div class="modal-body pb-0">

                    <!-- Basic Information Section -->
                    <h5 class="mb-3">Basic Information</h5>
                    <div class="row g-3 mb-4">

                        <div class="col-md-4">
                            <label class="form-label">Client ID</label>
                            <input type="text" name="client_id" disabled
                                class="form-control bg-light font-semibold cursor-not-allowed" value="Auto-generated">
                            <small class="text-muted">Auto-generated 7 alphanumeric characters</small>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">State <span class="text-danger">*</span></label>
                            <select class="form-select" name="state" required>
                                <option value="">Select State</option>
                                <option value="AL">Alabama</option>
                                <option value="CA">California</option>
                                <option value="TX">Texas</option>
                                <option value="WA">Washington</option>
                                <option value="GA">Georgia</option>
                                <option value="NY">New York</option>
                                <option value="FL">Florida</option>
                                <option value="IL">Illinois</option>
                                <option value="PA">Pennsylvania</option>
                                <option value="OH">Ohio</option>
                                <option value="MI">Michigan</option>
                                <option value="NC">North Carolina</option>
                                <option value="NJ">New Jersey</option>
                                <option value="VA">Virginia</option>
                                <option value="TN">Tennessee</option>
                                <option value="IN">Indiana</option>
                                <option value="AZ">Arizona</option>
                                <option value="MA">Massachusetts</option>
                                <option value="MO">Missouri</option>
                                <option value="MD">Maryland</option>
                                <option value="WI">Wisconsin</option>
                                <option value="CO">Colorado</option>
                                <option value="MN">Minnesota</option>
                                <option value="SC">South Carolina</option>
                                <option value="AL">Alabama</option>
                                <option value="LA">Louisiana</option>
                                <option value="KY">Kentucky</option>
                                <option value="OR">Oregon</option>
                                <option value="OK">Oklahoma</option>
                                <option value="CT">Connecticut</option>
                                <option value="UT">Utah</option>
                                <option value="IA">Iowa</option>
                                <option value="NV">Nevada</option>
                                <option value="AR">Arkansas</option>
                                <option value="MS">Mississippi</option>
                                <option value="KS">Kansas</option>
                                <option value="NM">New Mexico</option>
                                <option value="NE">Nebraska</option>
                                <option value="WV">West Virginia</option>
                                <option value="ID">Idaho</option>
                                <option value="HI">Hawaii</option>
                                <option value="NH">New Hampshire</option>
                                <option value="ME">Maine</option>
                                <option value="MT">Montana</option>
                                <option value="RI">Rhode Island</option>
                                <option value="DE">Delaware</option>
                                <option value="SD">South Dakota</option>
                                <option value="ND">North Dakota</option>
                                <option value="AK">Alaska</option>
                                <option value="VT">Vermont</option>
                                <option value="WY">Wyoming</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Pay Period <span class="text-danger">*</span></label>
                            <select class="form-select" name="pay_period" required>
                                <option value="">Select Pay Period</option>
                                <option value="Weekly">Weekly</option>
                                <option value="Biweekly">Biweekly</option>
                                <option value="Semi-Monthly">Semi-Monthly</option>
                                <option value="Monthly">Monthly</option>
                            </select>
                        </div>

                    </div>

                    <!-- Company Information Section -->
                    <h5 class="mb-3">Company Information</h5>
                    <div class="row g-3 mb-4">

                        <div class="col-md-4">
                            <label class="form-label">Legal Name <span class="text-danger">*</span></label>
                            <input type="text" name="legal_name" class="form-control" required>
                            <small class="text-muted">Official legal name of the company</small>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">DBA</label>
                            <input type="text" name="dba" class="form-control">
                            <small class="text-muted">Doing Business As (optional)</small>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Industry Type</label>
                            <input type="text" name="industry_type" class="form-control">
                            <small class="text-muted">Type of industry or business sector</small>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Tax ID <span class="text-danger">*</span></label>
                            <input type="text" name="tax_id" class="form-control" required>
                            <small class="text-muted">Federal Tax Identification Number</small>
                        </div>

                    </div>

                    <!-- Client Status Section -->
                    <div class="mb-3">
                        <label class="form-label">Client Status</label>

                        <div class="d-flex gap-4">
                            <div class="form-check form-check-md">
                                <input class="form-check-input" type="radio" name="is_active" id="status_active"
                                    value="true" checked>
                                <label class="form-check-label" for="status_active">
                                    Active
                                </label>
                            </div>

                            <div class="form-check form-check-md">
                                <input class="form-check-input" type="radio" name="is_active" id="status_inactive"
                                    value="false">
                                <label class="form-check-label" for="status_inactive">
                                    Inactive
                                </label>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Client</button>
                </div>
            </form>
        </div>
    </div>
</div>

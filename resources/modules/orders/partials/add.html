{% load static %}
<!-- Add Client Modal -->
<div class="modal fade" id="add">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"><i class="fa fa-layer-plus"></i> Add New Order</h4>
                <button type="button" class="btn-close custom-btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="ti ti-x"></i>
                </button>
            </div>

            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="peo" value="PEO45678">
                <div class="modal-body pb-0">

                    <!-- Basic Information Section -->
                    <h5 class="mb-3">Basic Information</h5>
                    <div class="row g-3 mb-4">
                        
                        <div class="col-md-4">
                            <label class="form-label">Case ID <span class="text-danger">*</span></label>
                            <input type="text" name="case_id" class="form-control" required>
                            <small class="text-muted">Must be unique in the system</small>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Social Security Number <span class="text-danger">*</span></label>
                            <input type="text" name="employee" class="form-control" required>
                            <small class="text-muted">SSN</small>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">FEIN <span class="text-danger">*</span></label>
                            <input type="text" name="fein" class="form-control" required placeholder="XX-XXXXXXX">
                            <small class="text-muted">Enter the employer's FEIN</small>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label">Work State <span class="text-danger">*</span></label>
                        <select name="work_state" class="form-select" required>
                            <option value="">Select State</option>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="CT">Connecticut</option>
                            <option value="DE">Delaware</option>
                            <option value="FL">Florida</option>
                            <option value="GA">Georgia</option>
                            <option value="HI">Hawaii</option>
                            <option value="ID">Idaho</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="IA">Iowa</option>
                            <option value="KS">Kansas</option>
                            <option value="KY">Kentucky</option>
                            <option value="LA">Louisiana</option>
                            <option value="ME">Maine</option>
                            <option value="MD">Maryland</option>
                            <option value="MA">Massachusetts</option>
                            <option value="MI">Michigan</option>
                            <option value="MN">Minnesota</option>
                            <option value="MS">Mississippi</option>
                            <option value="MO">Missouri</option>
                            <option value="MT">Montana</option>
                            <option value="NE">Nebraska</option>
                            <option value="NV">Nevada</option>
                            <option value="NH">New Hampshire</option>
                            <option value="NJ">New Jersey</option>
                            <option value="NM">New Mexico</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="ND">North Dakota</option>
                            <option value="OH">Ohio</option>
                            <option value="OK">Oklahoma</option>
                            <option value="OR">Oregon</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="RI">Rhode Island</option>
                            <option value="SC">South Carolina</option>
                            <option value="SD">South Dakota</option>
                            <option value="TN">Tennessee</option>
                            <option value="TX">Texas</option>
                            <option value="UT">Utah</option>
                            <option value="VT">Vermont</option>
                            <option value="VA">Virginia</option>
                            <option value="WA">Washington</option>
                            <option value="WV">West Virginia</option>
                            <option value="WI">Wisconsin</option>
                            <option value="WY">Wyoming</option>
                        </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Issuing State <span class="text-danger">*</span></label>
                            <select name="issuing_state" class="form-select" required>
                                <option value="">Select State</option>
                                <option value="AL">Alabama</option>
                                <option value="AK">Alaska</option>
                                <option value="AZ">Arizona</option>
                                <option value="AR">Arkansas</option>
                                <option value="CA">California</option>
                                <option value="CO">Colorado</option>
                                <option value="CT">Connecticut</option>
                                <option value="DE">Delaware</option>
                                <option value="FL">Florida</option>
                                <option value="GA">Georgia</option>
                                <option value="HI">Hawaii</option>
                                <option value="ID">Idaho</option>
                                <option value="IL">Illinois</option>
                                <option value="IN">Indiana</option>
                                <option value="IA">Iowa</option>
                                <option value="KS">Kansas</option>
                                <option value="KY">Kentucky</option>
                                <option value="LA">Louisiana</option>
                                <option value="ME">Maine</option>
                                <option value="MD">Maryland</option>
                                <option value="MA">Massachusetts</option>
                                <option value="MI">Michigan</option>
                                <option value="MN">Minnesota</option>
                                <option value="MS">Mississippi</option>
                                <option value="MO">Missouri</option>
                                <option value="MT">Montana</option>
                                <option value="NE">Nebraska</option>
                                <option value="NV">Nevada</option>
                                <option value="NH">New Hampshire</option>
                                <option value="NJ">New Jersey</option>
                                <option value="NM">New Mexico</option>
                                <option value="NY">New York</option>
                                <option value="NC">North Carolina</option>
                                <option value="ND">North Dakota</option>
                                <option value="OH">Ohio</option>
                                <option value="OK">Oklahoma</option>
                                <option value="OR">Oregon</option>
                                <option value="PA">Pennsylvania</option>
                                <option value="RI">Rhode Island</option>
                                <option value="SC">South Carolina</option>
                                <option value="SD">South Dakota</option>
                                <option value="TN">Tennessee</option>
                                <option value="TX">Texas</option>
                                <option value="UT">Utah</option>
                                <option value="VT">Vermont</option>
                                <option value="VA">Virginia</option>
                                <option value="WA">Washington</option>
                                <option value="WV">West Virginia</option>
                                <option value="WI">Wisconsin</option>
                                <option value="WY">Wyoming</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Garnishment Type <span class="text-danger">*</span></label>
                            <select name="garnishment_type" class="form-select" required>
                                <option value="">Select Type</option>
                                <option value="Child_Support">Child Support</option>
                                <option value="Federal_Tax_Levy">Federal Tax Levy</option>
                                <option value="Student_Default_Loan">Student Default Loan</option>
                                <option value="Creditor_Debt">Creditor Debt</option>
                                <option value="Franchise_Tax_Board">Franchise Tax Board</option>
                                <option value="State_Tax_Levy">State Tax Levy</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Payee <span class="text-danger">*</span></label>
                            <input type="text" name="payee" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Garnishing Authority <span class="text-danger">*</span></label>
                            <input type="text" name="garnishing_authority" class="form-control" required>
                        </div>
                    </div>

                    <!-- Financial Information -->
                    <h5 class="mb-3">Financial Information</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label">Ordered Amount <span class="text-danger">*</span></label>
                            <input type="number" name="ordered_amount" class="form-control" min="0" step="0.01"
                                required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Withholding Amount <span class="text-danger">*</span></label>
                            <input type="number" name="withholding_amount" class="form-control" min="0" step="0.01"
                                required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Arrear Amount</label>
                            <input type="number" name="arrear_amount" class="form-control" min="0" step="0.01">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Garnishment Fees <span class="text-danger">*</span></label>
                            <input type="number" name="garnishment_fees" class="form-control" min="0" step="0.01"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Override Amount <span class="text-danger">*</span></label>
                            <input type="number" name="override_amount" class="form-control" min="0" step="0.01"
                                required>
                        </div>
                    </div>

                    <!-- Dates Section -->
                    <h5 class="mb-3">Date Information</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label">Start Date <span class="text-danger">*</span></label>
                            <input type="date" name="start_date" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Stop Date <span class="text-danger">*</span></label>
                            <input type="date" name="stop_date" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Issued Date <span class="text-danger">*</span></label>
                            <input type="date" name="issued_date" class="form-control" required>
                        </div>
                    </div>

                    <!-- Notes -->
                    <h5 class="mb-3">Notes</h5>
                    <div class="mb-4">
                        <label class="form-label">Additional Notes</label>
                        <textarea name="notes" rows="4" class="form-control"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Order</button>
                </div>
            </form>
        </div>
    </div>
</div>

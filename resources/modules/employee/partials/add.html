{% load static %}
<!-- Add Client Modal -->
<div class="modal fade" id="add">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"><i class="fa fa-layer-plus"></i> Add New Employee</h4>
                <button type="button" class="btn-close custom-btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="ti ti-x"></i>
                </button>
            </div>

            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="peo" value="PEO45678">

                <div class="modal-body pb-0">

                    <!-- Basic Information Section -->
                    <h5 class="mb-3">Basic Information</h5>
                    <div class="row g-3 mb-4">

                        <div class="col-md-4">
                            <label class="form-label">Employee ID <span class="text-danger">*</span></label>
                            <input type="text" name="ee_id" class="form-control" required>
                            <small class="text-muted">Unique alphanumeric employee ID</small>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Client ID <span class="text-danger">*</span></label>
                            <select class="form-select" name="client" required>
                                <option value="">Select Client</option>
                                <option value="CLT900765">CLT900765 - TechWave Solutions Inc.</option>
                                <option value="CLT10097">CLT10097 - NextGen Retailers Inc.</option>
                                <option value="CLT1000">CLT1000 - NextGen Retailers Inc.</option>
                                <option value="CLT10007">CLT10007 - NextGen Retailers Inc.</option>
                                <option value="CLT10008">CLT10008 - NextGen Retailers LLC</option>
                                <option value="CLT10009">CLT10009 - GlobalEdge Logistics LLC</option>
                                <option value="CLT98765">CLT98765 - TechWave Solutions Inc.</option>
                                <option value="OPC4FPX">OPC4FPX - NextGen Retailers LLC</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">First Name <span class="text-danger">*</span></label>
                            <input type="text" name="first_name" class="form-control" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Middle Name</label>
                            <input type="text" name="middle_name" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Last Name <span class="text-danger">*</span></label>
                            <input type="text" name="last_name" class="form-control" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">SSN <span class="text-danger">*</span></label>
                            <input type="text" name="ssn" maxlength="11" class="form-control" required
                                placeholder="XXX-XX-XXXX">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Age <span class="text-danger">*</span></label>
                            <input type="number" name="age" class="form-control" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Gender <span class="text-danger">*</span></label>
                            <select class="form-select" name="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Marital Status <span class="text-danger">*</span></label>
                            <select class="form-select" name="marital_status" required>
                                <option value="">Select Marital Status</option>
                                <option value="Unmarried">Unmarried</option>
                                <option value="Married">Married</option>
                                <option value="Divorced">Divorced</option>
                                <option value="Widowed">Widowed</option>
                            </select>
                        </div>

                    </div>

                    <!-- Location & Employment Section -->
                    <h5 class="mb-3">Location & Employment</h5>
                    <div class="row g-3 mb-4">

                        <div class="col-md-4">
                            <label class="form-label">Home State <span class="text-danger">*</span></label>
                            <select class="form-select" name="home_state" required>
                                <option value="">Select Home State</option>
                                <option value="Alabama">Alabama</option>
                                <option value="California">California</option>
                                <option value="Texas">Texas</option>
                                <!-- Add other states as needed -->
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Work State <span class="text-danger">*</span></label>
                            <select class="form-select" name="work_state" required>
                                <option value="">Select Work State</option>
                                <option value="Alabama">Alabama</option>
                                <option value="California">California</option>
                                <option value="Texas">Texas</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Pay Period <span class="text-danger">*</span></label>
                            <select class="form-select" name="pay_period" required>
                                <option value="">Select Pay Period</option>
                                <option value="Weekly">Weekly</option>
                                <option value="Biweekly">Biweekly</option>
                                <option value="SemiMonthly">Semi-Monthly</option>
                                <option value="Monthly">Monthly</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Number of Exemptions <span class="text-danger">*</span></label>
                            <input type="number" name="number_of_exemptions" class="form-control" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Dependent Children</label>
                            <input type="number" name="number_of_dependent_child" class="form-control" value="0">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Active Garnishments</label>
                            <input type="number" name="number_of_active_garnishment" class="form-control">
                        </div>

                    </div>

                    <!-- Status & Conditions Section -->
                    <h5 class="mb-3">Status & Conditions</h5>
                    <div class="mb-3">
                        <label class="form-label">Is Active</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="is_active" id="is_active_true"
                                value="true" checked>
                            <label class="form-check-label" for="is_active_true">Active</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="is_active" id="is_active_false"
                                value="false">
                            <label class="form-check-label" for="is_active_false">Inactive</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Garnishment Fees Status</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="garnishment_fees_status" value="true">
                            <label class="form-check-label">Active</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="garnishment_fees_status" value="false"
                                checked>
                            <label class="form-check-label">Suspended</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Support Second Family</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="support_second_family" value="true">
                            <label class="form-check-label">Yes</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="support_second_family" value="false"
                                checked>
                            <label class="form-check-label">No</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Is Blind</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="is_blind" value="true">
                            <label class="form-check-label">Yes</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="is_blind" value="false" checked>
                            <label class="form-check-label">No</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Is Spouse Blind</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="is_spouse_blind" value="true">
                            <label class="form-check-label">Yes</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="is_spouse_blind" value="false" checked>
                            <label class="form-check-label">No</label>
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Employee</button>
                </div>
            </form>


        </div>
    </div>
</div>
